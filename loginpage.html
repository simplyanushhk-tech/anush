<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keystone — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#EDEAE3;
    --bg:#14151A;
    --bg-2:#1B1D24;
    --brass:#C9A227;
    --brass-dim:#8A741D;
    --slate:#8A8D96;
    --line:#2C2E37;
    --error:#C1443A;
    --ok:#4E9E6E;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, rgba(201,162,39,0.08), transparent),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }

  .stage{
    width:100%;
    max-width:400px;
    position:relative;
  }

  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    margin-bottom:32px;
  }
  .mark{width:52px;height:52px;}
  .mark svg{width:100%;height:100%;display:block;}
  .wordmark{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:0.01em;
    color:var(--ink);
  }
  .tagline{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--slate);
  }

  .card{
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:40px 32px 32px;
    position:relative;
    overflow:hidden;
  }
  .notch{
    position:absolute;
    top:0; left:0; right:0;
    height:14px;
    background:
      repeating-linear-gradient(90deg,
        var(--bg) 0 6px,
        transparent 6px 14px);
    -webkit-mask: radial-gradient(circle 3px at 10px 0, transparent 3px, #000 3.5px);
    border-bottom:1px dashed var(--line);
  }

  .card-head{margin-bottom:28px;}
  .card-head h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:19px;
    margin:0 0 4px;
  }
  .card-head p{margin:0;font-size:13px;color:var(--slate);}

  form{display:flex;flex-direction:column;gap:18px;}

  .field{display:flex;flex-direction:column;gap:8px;}
  .field label{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--brass);
  }
  .input-wrap{
    position:relative;
    display:flex;
    align-items:center;
    border-bottom:1px solid var(--line);
    transition:border-color .2s ease;
  }
  .input-wrap:focus-within{border-color:var(--brass);}
  .input-wrap svg{
    width:16px;height:16px;
    flex-shrink:0;
    color:var(--slate);
    transition:color .2s ease;
  }
  .input-wrap:focus-within svg{color:var(--brass);}

  input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--ink);
    font-family:'JetBrains Mono',monospace;
    font-size:14.5px;
    letter-spacing:0.02em;
    padding:10px 8px;
  }
  input::placeholder{color:#54575F;}

  .toggle-visibility{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--slate);
    padding:6px;
    display:flex;
    align-items:center;
    transition:color .2s ease;
  }
  .toggle-visibility:hover{color:var(--ink);}
  .toggle-visibility svg{width:16px;height:16px;}

  .row-between{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:12.5px;
    margin-top:-4px;
  }
  .remember{
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--slate);
    cursor:pointer;
    user-select:none;
  }
  .remember input[type="checkbox"]{
    appearance:none;
    width:14px;height:14px;
    border:1px solid var(--line);
    border-radius:2px;
    background:transparent;
    cursor:pointer;
    position:relative;
    padding:0;
    flex-shrink:0;
  }
  .remember input[type="checkbox"]:checked{
    background:var(--brass);
    border-color:var(--brass);
  }
  .remember input[type="checkbox"]:checked::after{
    content:"";
    position:absolute;
    left:4px; top:1px;
    width:3px; height:7px;
    border:solid var(--bg);
    border-width:0 2px 2px 0;
    transform:rotate(40deg);
  }
  .forgot{color:var(--brass-dim);text-decoration:none;transition:color .2s ease;}
  .forgot:hover{color:var(--brass);}

  .submit{
    margin-top:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:var(--brass);
    color:var(--bg);
    border:none;
    border-radius:2px;
    padding:13px 20px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:background .2s ease, transform .1s ease;
  }
  .submit:hover{background:#DCB233;}
  .submit:active{transform:translateY(1px);}
  .led{
    width:7px;height:7px;
    border-radius:50%;
    background:var(--bg);
    opacity:0.35;
    transition:background .3s ease, opacity .3s ease, box-shadow .3s ease;
  }
  form.armed .led{
    background:var(--ok);
    opacity:1;
    box-shadow:0 0 6px var(--ok);
  }

  .status{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--slate);
    text-align:center;
    margin-top:2px;
    min-height:14px;
  }

  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:26px 0 20px;
    color:var(--slate);
    font-size:11px;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}

  .footer-note{text-align:center;font-size:12.5px;color:var(--slate);}
  .footer-note a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--brass-dim);}
  .footer-note a:hover{border-color:var(--brass);}

  input:focus-visible, button:focus-visible, a:focus-visible{
    outline:1.5px solid var(--brass);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
  @media (max-width:420px){.card{padding:32px 22px 26px;}}
</style>
</head>
<body>

<div class="stage">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 52 52" fill="none">
        <circle cx="26" cy="26" r="25" stroke="#C9A227" stroke-width="1.2"/>
        <path d="M26 14a8 8 0 0 0-8 8v3h-1.5A1.5 1.5 0 0 0 15 26.5v11A1.5 1.5 0 0 0 16.5 39h19a1.5 1.5 0 0 0 1.5-1.5v-11A1.5 1.5 0 0 0 35.5 25H34v-3a8 8 0 0 0-8-8Zm0 3.2a4.8 4.8 0 0 1 4.8 4.8v3h-9.6v-3A4.8 4.8 0 0 1 26 17.2Z" fill="#C9A227"/>
        <circle cx="26" cy="31" r="2.1" fill="#14151A"/>
      </svg>
    </span>
    <span class="wordmark">Keystone</span>
    <span class="tagline">Access Console</span>
  </div>

  <div class="card">
    <div class="notch" aria-hidden="true"></div>
    <div class="card-head">
      <h1>Sign in</h1>
      <p>Enter your credentials to continue.</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="userId">Login ID</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>
          <input type="text" id="userId" name="userId" placeholder="ID-00000" autocomplete="username" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="password" name="password" placeholder="••••••••••" autocomplete="current-password" required>
          <button type="button" class="toggle-visibility" id="toggleBtn" aria-label="Show password">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="row-between">
        <label class="remember">
          <input type="checkbox" id="remember">
          Keep me signed in
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="submit">
        <span class="led" aria-hidden="true"></span>
        <span id="submitLabel">Unlock</span>
      </button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>

    <div class="divider">or</div>
    <p class="footer-note">No credentials yet? <a href="#">Request access</a></p>
  </div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const idInput = document.getElementById('userId');
  const pwInput = document.getElementById('password');
  const status = document.getElementById('status');
  const submitLabel = document.getElementById('submitLabel');

  function checkArm(){
    if(idInput.value.trim() && pwInput.value.trim()){
      form.classList.add('armed');
    } else {
      form.classList.remove('armed');
    }
  }
  idInput.addEventListener('input', checkArm);
  pwInput.addEventListener('input', checkArm);

  const toggleBtn = document.getElementById('toggleBtn');
  const eyeIcon = document.getElementById('eyeIcon');
  toggleBtn.addEventListener('click', () => {
    const showing = pwInput.type === 'text';
    pwInput.type = showing ? 'password' : 'text';
    toggleBtn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    eyeIcon.innerHTML = showing
      ? '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>'
      : '<path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M6.5 6.7C4 8.3 2 12 2 12s3.6 7 10 7c1.8 0 3.4-.5 4.7-1.2"/><path d="M17.9 17.9C20.4 16.2 22 12 22 12s-1.4-2.8-4-4.7"/>';
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if(!idInput.value.trim() || !pwInput.value.trim()){
      status.textContent = 'Enter both fields to continue.';
      status.style.color = 'var(--error)';
      return;
    }
    submitLabel.textContent = 'Verifying…';
    status.textContent = '';
    setTimeout(() => {
      submitLabel.textContent = 'Unlock';
      status.textContent = 'Demo only — no account was created or checked.';
      status.style.color = 'var(--slate)';
    }, 900);
  });
</script>
</body>
</html>
