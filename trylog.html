<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1428;
    --panel:#171D3A;
    --panel-2:#1D2445;
    --line:#2C3460;
    --gold:#C9A227;
    --gold-soft:#E4C25A;
    --text:#EDEFF7;
    --muted:#8A91B5;
    --error:#E0705C;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
  }

  body{
    font-family:'Inter', sans-serif;
    background:
      radial-gradient(1100px 600px at 18% -10%, rgba(201,162,39,0.10), transparent 60%),
      radial-gradient(900px 600px at 100% 110%, rgba(90,110,220,0.12), transparent 60%),
      var(--ink);
    color:var(--text);
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
  }

  .stage{
    width:100%;
    max-width:404px;
  }

  /* ---- Logo mark ---- */
  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:30px;
  }

  .mark{
    width:52px;
    height:52px;
    margin-bottom:16px;
    position:relative;
  }

  .mark svg{ width:100%; height:100%; display:block; }

  .mark .ring{
    fill:none;
    stroke:var(--gold);
    stroke-width:1.4;
    opacity:0.55;
  }

  .mark .core{
    fill:var(--gold-soft);
  }

  .wordmark{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:26px;
    letter-spacing:0.01em;
    color:var(--text);
  }

  .scan{
    width:120px;
    height:2px;
    margin-top:14px;
    background:linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
    background-size:200% 100%;
    animation:sweep 3.2s ease-in-out infinite;
    border-radius:2px;
  }

  @keyframes sweep{
    0%{ background-position:200% 0; opacity:.3;}
    50%{ opacity:1;}
    100%{ background-position:-200% 0; opacity:.3;}
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--muted);
    text-transform:uppercase;
    margin-top:10px;
  }

  /* ---- Card ---- */
  .card{
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:18px;
    padding:34px 30px 28px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
  }

  form{ display:flex; flex-direction:column; gap:18px; }

  .field{
    position:relative;
  }

  .field input{
    width:100%;
    background:#12173080;
    border:1px solid var(--line);
    border-radius:10px;
    padding:19px 14px 8px;
    font-family:'Inter', sans-serif;
    font-size:15px;
    color:var(--text);
    outline:none;
    transition:border-color .18s ease, box-shadow .18s ease;
  }

  .field input::placeholder{ color:transparent; }

  .field label{
    position:absolute;
    left:14px;
    top:18px;
    font-size:15px;
    color:var(--muted);
    pointer-events:none;
    transform-origin:left top;
    transition:transform .16s ease, color .16s ease, top .16s ease;
  }

  .field input:focus,
  .field input:not(:placeholder-shown){
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(201,162,39,0.12);
  }

  .field input:focus + label,
  .field input:not(:placeholder-shown) + label{
    top:8px;
    transform:scale(0.74);
    color:var(--gold-soft);
  }

  .field .hint{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.05em;
    color:var(--muted);
    position:absolute;
    right:14px;
    top:19px;
  }

  .toggle-pass{
    position:absolute;
    right:12px;
    top:14px;
    background:none;
    border:none;
    color:var(--muted);
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.05em;
    cursor:pointer;
    padding:5px 6px;
    border-radius:6px;
    transition:color .15s ease;
  }
  .toggle-pass:hover{ color:var(--gold-soft); }

  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    color:var(--muted);
    margin-top:-4px;
  }

  .remember{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .remember input{
    appearance:none;
    width:15px;
    height:15px;
    border:1px solid var(--line);
    border-radius:4px;
    background:#12173080;
    cursor:pointer;
    position:relative;
    flex:none;
  }

  .remember input:checked{
    background:var(--gold);
    border-color:var(--gold);
  }

  .remember input:checked::after{
    content:'';
    position:absolute;
    left:4px; top:1px;
    width:4px; height:8px;
    border:solid var(--ink);
    border-width:0 2px 2px 0;
    transform:rotate(40deg);
  }

  .row a{
    color:var(--muted);
    text-decoration:none;
    border-bottom:1px dotted var(--line);
  }
  .row a:hover{ color:var(--gold-soft); border-color:var(--gold-soft); }

  button.submit{
    margin-top:6px;
    background:linear-gradient(180deg, var(--gold-soft), var(--gold));
    color:#231A03;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:15px;
    border:none;
    border-radius:10px;
    padding:14px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
    box-shadow:0 10px 24px -10px rgba(201,162,39,0.55);
  }

  button.submit:hover{ filter:brightness(1.05); transform:translateY(-1px); }
  button.submit:active{ transform:translateY(0px); filter:brightness(0.97); }

  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--muted);
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.1em;
    margin:4px 0 2px;
  }
  .divider::before, .divider::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }

  .footer-note{
    text-align:center;
    margin-top:22px;
    font-size:13px;
    color:var(--muted);
  }
  .footer-note a{
    color:var(--gold-soft);
    text-decoration:none;
    border-bottom:1px dotted var(--gold-soft);
  }

  .status{
    display:none;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.03em;
    color:var(--error);
    background:rgba(224,112,92,0.08);
    border:1px solid rgba(224,112,92,0.3);
    border-radius:8px;
    padding:9px 12px;
  }
  .status.show{ display:block; }

  @media (prefers-reduced-motion: reduce){
    .scan{ animation:none; }
  }

  @media (max-width:420px){
    .card{ padding:28px 20px 24px; }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 52 52">
        <circle class="ring" cx="26" cy="26" r="23"></circle>
        <path class="ring" d="M26 3 A23 23 0 0 1 49 26" stroke-linecap="round"></path>
        <circle class="core" cx="26" cy="26" r="5.5"></circle>
      </svg>
    </div>
    <div class="wordmark">Meridian</div>
    <div class="scan"></div>
    <div class="eyebrow">Secure Access Portal</div>
  </div>

  <div class="card">
    <form id="loginForm" novalidate>

      <div class="status" id="statusMsg">Check your ID and password and try again.</div>

      <div class="field">
        <input type="text" id="userId" placeholder=" " autocomplete="username" required>
        <label for="userId">Login ID</label>
      </div>

      <div class="field">
        <input type="password" id="password" placeholder=" " autocomplete="current-password" required>
        <label for="password">Password</label>
        <button type="button" class="toggle-pass" id="togglePass">SHOW</button>
      </div>

      <div class="row">
        <label class="remember">
          <input type="checkbox" id="remember">
          Keep me signed in
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="submit">Sign in</button>

      <div class="divider">OR</div>

      <div class="footer-note">
        New here? <a href="#">Create an account</a>
      </div>

    </form>
  </div>

</div>

<script>
  const pass = document.getElementById('password');
  const toggle = document.getElementById('togglePass');
  toggle.addEventListener('click', () => {
    const isPass = pass.type === 'password';
    pass.type = isPass ? 'text' : 'password';
    toggle.textContent = isPass ? 'HIDE' : 'SHOW';
  });

  const form = document.getElementById('loginForm');
  const statusMsg = document.getElementById('statusMsg');
  const idField = document.getElementById('userId');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const id = idField.value.trim();
    const pw = pass.value.trim();

    if(!id || !pw){
      statusMsg.textContent = 'Enter both your Login ID and password to continue.';
      statusMsg.classList.add('show');
      return;
    }

    statusMsg.classList.remove('show');
    // Placeholder for real authentication logic.
    alert('Sign-in submitted for: ' + id);
  });
</script>

</body>
</html>
